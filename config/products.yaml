# Product Registry - Tools used per space
# ========================================
#
# Used by check_product_update action to determine newsletter relevance.
# When a product newsletter arrives, the processor checks:
# 1. Which space(s) use this product
# 2. Whether the email content matches relevance keywords
# 3. If relevant, creates an inbox task for that space
#
# Pattern: Similar to rules.base.yaml layered approach

version: 1
description: Product registry for newsletter relevance checking

products:
  # ==========================================================================
  # Analytics & Monitoring
  # ==========================================================================

  posthog:
    name: PostHog
    category: analytics
    website: https://posthog.com
    used_by:
      - space: 1-teamspace
        purpose: "Product analytics, web tracking for Project Alpha"
    newsletter_senders:
      - "posthog"
      - "joe at posthog"
    relevance_keywords:
      - analytics
      - web vitals
      - UTM
      - conversion
      - session recording
      - feature flags
      - A/B test
      - funnel

