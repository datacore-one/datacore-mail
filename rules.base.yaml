    # LinkedIn notifications → SPAM (archive immediately)
    - pattern: "linkedin"
      action: archive_only
      type: spam
      reason: "LinkedIn notification spam"
    - pattern: "(via linkedin)"
      action: archive_only
      type: spam
    - pattern: "adinda"
      action: archive_only
      type: spam
    - pattern: "gaja (via"
      action: archive_only
      type: spam
    - pattern: "nicolas (via"
      action: archive_only
      type: spam
    # Promotional emails → archive
    - pattern: "revolut"
      action: archive_only
