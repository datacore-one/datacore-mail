      reason: "a16z crypto - leading VC research"
    - pattern: "a16zcrypto"
      topics: [crypto, tech, VC, research]
      action: prepare_for_research
    # Crypto macro analysis
    - pattern: "cryptohayes"
      topics: [crypto, macro, trading, bitcoin]
      action: prepare_for_research
      reason: "Arthur Hayes - BitMEX founder, crypto macro analysis"
    - pattern: "arthur hayes"
      topics: [crypto, macro, trading, bitcoin]
      action: prepare_for_research
    # Tech/Business strategy
    - pattern: "notboring"
      topics: [tech, strategy, startups, business]
      action: prepare_for_research
      reason: "Packy McCormick - Not Boring, high quality strategy/business"
    - pattern: "packy"
      topics: [tech, strategy, startups, business]
      action: prepare_for_research
    # Crypto/Web3 strategy
    - pattern: "cdixon"
      topics: [crypto, web3, strategy, VC]
      action: prepare_for_research
      url_pattern: "cdixon.substack.com/p/"
      reason: "Chris Dixon (a16z) - crypto/web3 strategy"
    # Media/Tech/Society
    - pattern: "casey newton"
      topics: [tech, media, society, platforms]
      action: prepare_for_research
      reason: "Casey Newton - Platformer, tech/society deep dives"
    - pattern: "platformer"
      topics: [tech, media, society, platforms]
