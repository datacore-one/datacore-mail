  # AI/LLM API provider invoices & receipts (per ENG-2026-0521-023) — for
  # API cost tracking. Matching a sender here tags the email FINANCE (see
  # classifier.py api_cost_match block, added 2026-07-02); if it also has a
  # PDF attachment, the existing FINANCE+has_pdf check routes it to the
  # accounting processor — same mechanism "invoice"/"racun" subject matches
  # already use. This gets provider invoices into accounting.org today.
  # A dedicated per-provider API-cost ledger (amount/currency/date broken
  # out by provider, not just filed as a generic invoice) is a separate,
  # larger follow-up — see "Mail rules: add api_cost_providers group" in
  # next_actions.org for the original ask.
  api_cost_providers:
