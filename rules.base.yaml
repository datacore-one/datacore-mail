domains:
  newsletter:
    - "substack.com"
    - "beehiiv.com"
    - "convertkit.com"
    - "mailchimp.com"

# =============================================================================
# GITHUB RULES (special handling for GitHub notifications)
# =============================================================================
#
# GitHub notifications are routed to the specialized GitHubProcessor which:
# - Fetches current PR/Issue state via gh CLI
# - Finds linked org tasks by :EXTERNAL_ID:
# - Auto-updates tasks when issues/PRs close
# - Surfaces only emails needing human reply
#

github:
  # Notification sender (routed to GitHubProcessor)
  notification_senders:
    - "noreply6@service.example.com"

  # Event types — keys MUST match the literal X-GitHub-Reason header values.
  # Reference: https://docs.github.com/en/rest/activity/notifications
  #
  # Policy: GitHub email is a duplicate of the GitHub notification feed.
  # The user triages real action items via `gh api notifications` / the
  # GitHub web UI / the /triage-github skill, NOT via email. So every
  # github email gets archived after classification — the only exceptions
  # are security_advisory (often surfaces in email before being visible
  # elsewhere). The category stays "github" + action "task" for the few
  # ACTIONABLE ones so they're visible in scan summaries, but archive:true
  # keeps the inbox clean.
  events:
    review_requested:
      action: INFORMATIONAL
      archive: true
    mention:
      action: INFORMATIONAL
      archive: true
    team_mention:
      action: INFORMATIONAL
      archive: true
    assign:
      action: INFORMATIONAL
      archive: true
    changes_requested:
      action: INFORMATIONAL
      archive: true
    author:                    # comment on a thread you opened
      action: INFORMATIONAL
      archive: true
    state_change:              # merged / closed / reopened
      action: INFORMATIONAL
      archive: true
    comment:
      action: INFORMATIONAL
      archive: true
    approved:
      action: INFORMATIONAL
      archive: true
    push:
      action: INFORMATIONAL
      archive: true
    subscribed:
      action: INFORMATIONAL
      archive: true
    manual:
      action: INFORMATIONAL
      archive: true
    ci_activity:
      action: INFORMATIONAL
      archive: true
    your_activity:
      action: INFORMATIONAL
      archive: true
    security_advisory:         # surface security advisories
      action: ACTIONABLE
      priority: HIGH

  # Keywords that make GitHub emails ACTIONABLE (legacy fallback)
  actionable_keywords:
    - "assigned to you"
    - "requested your review"
    - "mentioned you"
    - "you were requested"
    - "your action is requested"

  # Keywords that make GitHub emails INFORMATIONAL (legacy fallback)
  informational_keywords:
    - "merged"
    - "closed"
    - "commented"
    - "pushed"
    - "approved"

  # Repo patterns for routing
  repos: []
  # Space-specific: Add repo rules in {space}/mail-rules.yaml
  # Example:
  #   - pattern: "org-name/project-alpha"
  #     space: 2-projectspace
  #     priority: HIGH
  #     fetch_context: true

# =============================================================================
# N8N RULES (workflow automation platform)
# =============================================================================
#
# n8n notifications for workspace management - version updates, alerts, etc.
# Similar to GitHub: route to check if action needed, archive if automated
#

n8n:
  # Notification sender (identifies n8n emails)
  notification_senders:
    - "support1@vendor.example.com"
    - "noreply4@service.example.com"
    - "support3@vendor.example.com"

  # Event types and their actions
  events:
    version_update:
      patterns:
        - "version expires"
        - "forced update"
        - "auto-update"
        - "workspace will be"
      action: INFORMATIONAL
      type: maintenance
      archive: true
      reason: "Auto-updates handled by n8n Cloud, no action needed"
    workflow_error:
      patterns:
        - "workflow failed"
        - "execution error"
        - "workflow stopped"
      action: ACTIONABLE
      priority: HIGH
      reason: "Workflow failures need investigation"
    usage_alert:
      patterns:
        - "execution limit"
        - "approaching limit"
        - "usage warning"
      action: ACTIONABLE
      priority: MEDIUM
    security_alert:
      patterns:
        - "security"
        - "vulnerability"
        - "urgent security"
      action: ACTIONABLE
      priority: HIGH

  # Workspace config
  workspaces:
    - name: team
      space: 1-teamspace
      url: "https://team.app.n8n.cloud"

# =============================================================================
# ACTIONS (cross-module integration)
# =============================================================================

actions:
  # Route to accounting module
  route_to_accounting:
    description: "Route invoice/payment emails to accounting processor"
    module: accounting
    method: process_invoice
    extract:
      - invoice_number
      - amount
      - due_date
      - vendor

  # Prepare for research (high-quality newsletters like AVC, HBR, Ben's Bites)
  prepare_for_research:
    description: "Extract article URL, create inbox task for later research, archive email"
    create_inbox_entry: true
    entry_type: research_link
    extract_url: true
    url_patterns:
      - "paragraph.com/@"    # AVC on Paragraph
      - "hbr.org/"           # Harvard Business Review
      - "stratechery.com/"   # Ben Thompson
      - "bensbites.com/p/"   # Ben's Bites
      - "veradiverdict.com/p/"  # Paul Veradittakit
    destination: "org/inbox.org"
    archive_email: true
    tags: [research, reading]

  # Check product update (tools we use)
  check_product_update:
    description: "Read product newsletter, check relevance to spaces, create task if actionable"
    check_relevance: true
    relevance_spaces:
      - 0-personal   # Personal tools (Napkin, Granola)
      - 1-teamspace   # Team tools (PostHog, n8n, DigitalOcean)
      - 2-projectspace   # Project tools (GitHub, Claude)
    create_task_if_relevant: true
    destination: "org/inbox.org"
    archive_email: true
    tags_by_space:
      0-personal: [tools]
      1-teamspace: [team, infrastructure]
      2-projectspace: [datacore, tools]

  # Extract insights (like session-learning) - for manual deep research
  extract_insights:
    description: "Extract strategic insights from research content"
