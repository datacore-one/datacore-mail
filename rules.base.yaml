# Mail Classification Rules - Base Layer
# ========================================
#
# This file contains default classification rules that apply across all spaces.
# This is the generic example. An installation keeps ALL its rules in one file,
# 0-personal/.datacore/module-data/mail/rules.yaml (lib/mail_rules.py); this file
# applies only when that one does not exist. Team-mailbox rules go under spaces:.
#
#
# Pattern: DIP-0002 Layered Context Pattern applied to email classification

version: 1
description: Default email classification rules

# =============================================================================
# SENDER RULES (most specific - match by email address or name)
# =============================================================================

# =============================================================================
# PROTECTED SENDERS (checked over every other rule — never auto-archived)
# =============================================================================
#
# Government, compliance, banking and company-registration mail carries legal
# deadlines. Whatever rule matches it (an "unsubscribe" footer, a promo sender
# rule, an accounting forward), a sender whose domain ends in one of these stays
# in the inbox, flagged HIGH and tagged "official". Suffix match: "gov.uk"
# covers hmrc.gov.uk. Add your own entries in your rules file.

protected:
  domains:
    # Government (suffix match: "gov.uk" covers hmrc.gov.uk). List your own
    # country's government and registry domains in your rules file.
    - "gov"                     # US federal
    - "gov.uk"                  # UK government, incl. companieshouse.gov.uk, hmrc.gov.uk
    - "europa.eu"               # EU institutions
    - "gov.ie"
    - "gov.si"
    - "gov.pl"
    - "gov.it"
    - "gouv.fr"
    - "gob.es"
    - "gv.at"
    - "bund.de"
    - "admin.ch"
    - "gov.au"
    - "gc.ca"
    # Company registration / registered office (UK formation agents)
    - "companieshouse.gov.uk"
    - "1stformations.co.uk"
    - "companiesmadesimple.com"
    # Banks (add your own bank's domain in your rules file)
    - "revolut.com"
    - "wise.com"

senders:
  # Senders that always trigger ACTIONABLE
  actionable: []
  # Space-specific: Add business contacts in the rules file (a team space: under spaces: <space>)
  # Example:
  #   - pattern: "jane@partner.example"
  #     priority: HIGH
  #     tags: [business]
  #     reason: "Key partner contact"

  # Senders that provide research/strategy content (INFORMATIONAL + RESEARCH track)
  # action: prepare_for_research = extract URL, create inbox task, archive email
  research:
    - pattern: "avc"
      topics: [investing, strategy, startups]
      action: prepare_for_research
      url_pattern: "paragraph.com/@avc/"
      reason: "AVC blog - strategy"
    - pattern: "stratechery"
      topics: [tech, strategy, business-models]
      action: prepare_for_research
    - pattern: "hbr"
      topics: [management, strategy, leadership]
      action: prepare_for_research
      url_pattern: "hbr.org/"
      reason: "Harvard Business Review"

  # Newsletter senders (INFORMATIONAL + NEWSLETTER track)
  # action: archive_only = read headlines, archive (no inbox entry)
  newsletter:
    # Daily news digests (aggregate into single daily digest task)
    - pattern: "therundownai"
      action: aggregate_daily_news
      type: daily_news
      category: ai_tech
    # Product updates from tools you use → check for relevance, may create task
    - pattern: "github"
      action: check_product_update
      product: github
      space: 2-projectspace
    # LinkedIn notifications → SPAM (archive immediately)
    - pattern: "linkedin"
      action: archive_only
      type: spam
      reason: "LinkedIn notification spam"
    - pattern: "(via linkedin)"
      action: archive_only
      type: spam
    # Banks are under protected.domains and are never auto-archived, even
    # when a promo rule would match them.
    - pattern: "booking.com"
      action: archive_only
      type: promo
    # Automated reports → archive
    - pattern: "noreply-analytics@google"
      action: archive_only
      type: automated_report


  # AI/LLM API provider invoices & receipts (per ENG-2026-0521-023) — for
  # API cost tracking. Matching a sender here tags the email FINANCE (see
  # classifier.py api_cost_match block, added 2026-07-02); if it also has a
  # PDF attachment, the existing FINANCE+has_pdf check routes it to the
  # accounting processor — same mechanism "invoice" subject matches
  # already use. This gets provider invoices into accounting.org today.
  # A dedicated per-provider API-cost ledger (amount/currency/date broken
  # out by provider, not just filed as a generic invoice) is a separate,
  # larger follow-up — see "Mail rules: add api_cost_providers group" in
  # next_actions.org for the original ask.
  api_cost_providers:
    - pattern: "x.ai"
      reason: "xAI API billing"
    - pattern: "openrouter"
    - pattern: "openai.com"
    - pattern: "anthropic.com"
      reason: "Anthropic API/Console billing"
    - pattern: "google cloud"
      reason: "Google Cloud AI billing — narrow pattern, avoid catching unrelated GCP mail"
    - pattern: "perplexity.ai"
    - pattern: "exa.ai"
    - pattern: "serpapi"
    - pattern: "jina.ai"

  # Senders to always ignore (SPAM)
  ignore:
    - pattern: "baerskin"
      reason: spam
    - pattern: "tactical"
      reason: spam
    # Cold-email outreach (sales prospecting using fake "Re:" subjects).
    # These come from disposable .shop / .top / .xyz domains with no
    # list-unsubscribe header and personalised first names like "Emma".
    - pattern: "@hirepartners.shop"
      reason: "cold sales — bookkeeping outreach with fake Re: subject"
    - pattern: "hirepartners"
      reason: "cold sales — bookkeeping outreach (sender name variants)"

# =============================================================================
# CALENDAR RULES (Google Calendar invitations and reminders)
# =============================================================================
#
# Calendar invite processing logic:
# 1. Check if event exists in calendar.org (by event ID or title+date match)
# 2. Check if event date has passed
# 3. Apply action based on state:
#    - Event exists in calendar.org → mark read, archive (already synced)
#    - Event has passed → mark read, archive
#    - New invitation (not in calendar) → ACTIONABLE (needs response)
#    - Cancellation → check if in calendar, remove if so, archive email
#

calendar:
  # Notification senders
  notification_senders:
    - "calendar-notification@google.com"
    - "calendar@google.com"

  # Credential-harvest lures in an invitation. Any match → category
  # "phishing", flagged to the owner, never archived, never answered.
  phishing:
    lure_patterns:
      - "verify your password"
      - "verify your account"
      - "verify your identity"
      - "account verification"
      - "confirm your password"
      - "confirm your credentials"
      - "will be suspended"
      - "mailbox will be"
      - "password expires"
      - "re-enter your password"
      - "login-microsoftonline"
      - "unusual sign-in activity"

  # Event types
  events:
    invitation:
      patterns:
        - "invitation:"
        - "invited you to"
      action: check_calendar_sync
      fallback_action: ACTIONABLE
      reason: "New invite - check if already synced, else needs response"
    updated_invitation:
      patterns:
        - "updated invitation:"
        - "has been updated"
      action: check_calendar_sync
      fallback_action: INFORMATIONAL
      reason: "Update - check if synced, archive if so"
    reminder:
      patterns:
        - "reminder:"
        - "upcoming event"
      action: check_event_passed
      archive_if_passed: true
      reason: "Reminder - archive if event has passed"
    accepted:
      patterns:
        - "accepted:"
        - "has accepted"
      action: INFORMATIONAL
      archive: true
    declined:
      patterns:
        - "declined:"
        - "has declined"
      action: INFORMATIONAL
      archive: true
    canceled:
      patterns:
        - "canceled:"
        - "has been canceled"
        - "cancelled:"
      action: check_calendar_remove
      archive: true
      reason: "Remove from calendar.org if present"

# =============================================================================
# SUBJECT RULES (match by email subject line)
# =============================================================================

subjects:
  # Calendar-related subjects → route to calendar processor
  calendar:
    - pattern: "invitation:"
      action: check_calendar_sync
    - pattern: "reminder:"
      action: check_event_passed
    - pattern: "updated invitation:"
      action: check_calendar_sync
    - pattern: "accepted:"
      action: archive_only
    - pattern: "declined:"
      action: archive_only
    - pattern: "canceled:"
      action: check_calendar_remove

  # Finance-related subjects → Add FINANCE track
  finance:
    # DUNNING FIRST. These must precede the generic "payment" pattern below,
    # because matching is first-hit and "payment" swallows every one of them.
    # Measured 2026-09-01: "€7.00 payment to X was unsuccessful", "US$24.40
    # payment to Cursor was unsuccessful again", "We couldn't process your
    # DigitalOcean payment" and "Payment required for team Acme" all
    # matched "payment" and were routed to accounting as if they were
    # receipts. Four vendors were failing on one dead card and the notices
    # were filed as bookkeeping instead of surfacing — the account owner
    # learned of it from a manual backlog sweep, not from the triage.
    #
    # A receipt is bookkeeping. A failed charge is an outage with a bill
    # attached, and it belongs in front of a human.
    - pattern: "unsuccessful"
      action: surface_actionable
      reason: "Failed charge — card or billing problem, not a receipt"
    - pattern: "payment required"
      action: surface_actionable
    - pattern: "payment failed"
      action: surface_actionable
    - pattern: "couldn't process"
      action: surface_actionable
    - pattern: "could not process"
      action: surface_actionable
    - pattern: "declined"
      action: surface_actionable
    - pattern: "past due"
      action: surface_actionable
    - pattern: "risk of suspension"
      action: surface_actionable
      reason: "Service about to be cut off — GCP dunning wording"
    - pattern: "invoice"
      action: route_to_accounting
    - pattern: "payment"
    # Tax / overdue / dunning notices — user must see, not just forward
    - pattern: "tax notice"
      action: surface_actionable
    - pattern: "overdue"
      action: surface_actionable

# =============================================================================
# BODY RULES (match by email body content)
# =============================================================================

body:
  # Newsletter indicators
  # action: archive_only made explicit here (2026-07-02) — classifier.py previously
  # detected these as NEWSLETTER but never set newsletter_action, so items only
  # matched via body/domain (not a sender rule) fell through to a dangerous
  # default in mail/processors/newsletter.py's batch_process_newsletters(),
  # which archives unrecognized actions with NO inbox entry. Fixed classifier.py
  # to default newsletter_action='archive_only' for domain/body matches too;
  # these explicit fields are belt-and-suspenders documentation of that default.
  newsletter:
    - pattern: "unsubscribe"
      action: archive_only
    - pattern: "view in browser"
      action: archive_only
    - pattern: "email preferences"
      action: archive_only
    - pattern: "opt out"
      action: archive_only
    - pattern: "weekly digest"
      action: archive_only
    - pattern: "still waiting for your response"
      action: archive_only
      reason: "LinkedIn spam"

# =============================================================================
# DOMAIN RULES (match by sender domain)
# =============================================================================

domains:
  newsletter:
    - "substack.com"
    - "beehiiv.com"
    - "convertkit.com"
    - "mailchimp.com"

# =============================================================================
# GITHUB RULES (special handling for GitHub notifications)
# =============================================================================
#
# GitHub notifications are routed to the specialized GitHubProcessor which:
# - Fetches current PR/Issue state via gh CLI
# - Finds linked org tasks by :EXTERNAL_ID:
# - Auto-updates tasks when issues/PRs close
# - Surfaces only emails needing human reply
#

github:
  # Notification sender (routed to GitHubProcessor)
  notification_senders:
    - "notifications@github.com"

  # Event types — keys MUST match the literal X-GitHub-Reason header values.
  # Reference: https://docs.github.com/en/rest/activity/notifications
  #
  # Policy (MEM-34, owner-approved promise 2026-09-26): each mail is judged
  # on its own; nothing is archived in bulk by sender or type. A mail that
  # asks the owner to do something -- review, reply to a mention, take an
  # assignment, answer requested changes -- is a to-do: it stays in the inbox
  # and becomes a task, and is archived AFTER it is handled
  # (ENG-2026-0623-013). Only notifications that ask nothing (merged, pushed,
  # CI, subscribed, own activity) are auto-archived. This replaces the older
  # "archive every github email" rule (ENG-2026-0511-036), which archived
  # review requests and @-mentions unread.
  events:
    review_requested:
      action: ACTIONABLE
      priority: HIGH
    mention:
      action: ACTIONABLE
      priority: HIGH
    team_mention:
      action: ACTIONABLE
      priority: MEDIUM
    assign:
      action: ACTIONABLE
      priority: HIGH
    changes_requested:
      action: ACTIONABLE
      priority: HIGH
    author:                    # comment on a thread you opened
      action: INFORMATIONAL
      archive: true
    state_change:              # merged / closed / reopened
      action: INFORMATIONAL
      archive: true
    comment:
      action: INFORMATIONAL
      archive: true
    approved:
      action: INFORMATIONAL
      archive: true
    push:
      action: INFORMATIONAL
      archive: true
    subscribed:
      action: INFORMATIONAL
      archive: true
    manual:
      action: INFORMATIONAL
      archive: true
    ci_activity:
      action: INFORMATIONAL
      archive: true
    your_activity:
      action: INFORMATIONAL
      archive: true
    security_advisory:         # surface security advisories
      action: ACTIONABLE
      priority: HIGH

  # Keywords that make GitHub emails ACTIONABLE (legacy fallback)
  actionable_keywords:
    - "assigned to you"
    - "requested your review"
    - "mentioned you"
    - "you were requested"
    - "your action is requested"

  # Keywords that make GitHub emails INFORMATIONAL (legacy fallback)
  informational_keywords:
    - "merged"
    - "closed"
    - "commented"
    - "pushed"
    - "approved"

  # Repo patterns for routing
  repos: []
  # Space-specific: Add repo rules in the rules file (a team space: under spaces: <space>)
  # Example:
  #   - pattern: "org-name/project-alpha"
  #     space: 2-projectspace
  #     priority: HIGH
  #     fetch_context: true

# =============================================================================
# N8N RULES (workflow automation platform)
# =============================================================================
#
# n8n notifications for workspace management - version updates, alerts, etc.
# Similar to GitHub: route to check if action needed, archive if automated
#

n8n:
  # Notification sender (identifies n8n emails)
  notification_senders:
    - "hello@info.n8n.io"
    - "noreply@n8n.io"
    - "support@n8n.io"

  # Event types and their actions
  events:
    version_update:
      patterns:
        - "version expires"
        - "forced update"
        - "auto-update"
        - "workspace will be"
      action: INFORMATIONAL
      type: maintenance
      archive: true
      reason: "Auto-updates handled by n8n Cloud, no action needed"
    workflow_error:
      patterns:
        - "workflow failed"
        - "execution error"
        - "workflow stopped"
      action: ACTIONABLE
      priority: HIGH
      reason: "Workflow failures need investigation"
    usage_alert:
      patterns:
        - "execution limit"
        - "approaching limit"
        - "usage warning"
      action: ACTIONABLE
      priority: MEDIUM
    security_alert:
      patterns:
        - "security"
        - "vulnerability"
        - "urgent security"
      action: ACTIONABLE
      priority: HIGH

  # Workspace config
  workspaces:
    - name: team
      space: 1-teamspace
      url: "https://team.app.n8n.cloud"

# =============================================================================
# ACTIONS (cross-module integration)
# =============================================================================

actions:
  # Route to accounting module
  route_to_accounting:
    description: "Route invoice/payment emails to accounting processor"
    module: accounting
    method: process_invoice
    extract:
      - invoice_number
      - amount
      - due_date
      - vendor

  # Prepare for research (high-quality newsletters)
  prepare_for_research:
    description: "Extract article URL, create inbox task for later research, archive email"
    create_inbox_entry: true
    entry_type: research_link
    extract_url: true
    url_patterns:
      - "paragraph.com/@"    # AVC on Paragraph
      - "hbr.org/"           # Harvard Business Review
      - "stratechery.com/"   # Ben Thompson
      - "bensbites.com/p/"   # Ben's Bites
    destination: "org/inbox.org"
    archive_email: true
    tags: [research, reading]

  # Check product update (tools we use)
  check_product_update:
    description: "Read product newsletter, check relevance to spaces, create task if actionable"
    check_relevance: true
    relevance_spaces:
      - 0-personal   # Personal tools
      - 1-teamspace   # Team tools (PostHog, n8n, DigitalOcean)
      - 2-projectspace   # Project tools (GitHub, Claude)
    create_task_if_relevant: true
    destination: "org/inbox.org"
    archive_email: true
    tags_by_space:
      0-personal: [tools]
      1-teamspace: [team, infrastructure]
      2-projectspace: [datacore, tools]

  # Extract insights (like session-learning) - for manual deep research
  extract_insights:
    description: "Extract strategic insights from research content"
    create_zettel: true
    zettel_template: research-insight
    topics_from: sender_config
    destination: "3-knowledge/research/"

  # Archive only (no org entry)
  archive_only:
    description: "Archive email without creating org entry"
    gmail_archive: true
    gmail_label: "datacore/archived"

# =============================================================================
# THREAD RULES (ongoing conversations)
# =============================================================================

threads:
  # Threads that should always be ACTIONABLE
  actionable: []
  # Space-specific: Add thread rules in the rules file (a team space: under spaces: <space>)
  # Example:
  #   - subject_contains: "Fundraising"
  #     priority: HIGH
  #     tags: [business, fundraising]

# =============================================================================
# SERVICE NOTIFICATIONS (auto-archived by the nightly triage)
# =============================================================================
notifications:
  npm_publish:
    senders: ["support@npmjs.com"]
    subject_contains: ["successfully published"]
    reason: "npm package publish notification"
  ga4_report:
    senders: ["noreply-analytics@google.com"]
    reason: "GA4 analytics report"

# =============================================================================
# TEAM MAILBOXES — rules applied only to one space's accounts
# =============================================================================
# spaces:
