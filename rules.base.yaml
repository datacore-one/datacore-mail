# Mail Classification Rules - Base Layer
# ========================================
#
# This file contains default classification rules that apply across all spaces.
# Override with space-specific rules in {space}/mail-rules.yaml
# Personal overrides in .datacore/modules/mail/rules.local.yaml (gitignored)
#
# Rules are merged in order: base → space → local (later wins)
#
# Pattern: DIP-0002 Layered Context Pattern applied to email classification

version: 1
description: Default email classification rules

# =============================================================================
# SENDER RULES (most specific - match by email address or name)
# =============================================================================

senders:
  # Senders that always trigger ACTIONABLE
  actionable: []
  # Space-specific: Add business contacts in {space}/mail-rules.yaml
  # Example:
  #   - pattern: "mayur"
  #     priority: HIGH
  #     tags: [business, fundraising]
  #     reason: "Key investor contact"

  # Senders that provide research/strategy content (INFORMATIONAL + RESEARCH track)
  # action: prepare_for_research = extract URL, create inbox task, archive email
  research:
    # Business/Strategy research (high quality, read for insights)
    - pattern: "avc"
      topics: [investing, strategy, web3, startups]
      action: prepare_for_research
      url_pattern: "paragraph.com/@avc/"
      reason: "Fred Wilson's AVC blog - valuable strategy insights"
    - pattern: "fred@avc"
      topics: [investing, strategy, web3, startups]
      action: prepare_for_research
    - pattern: "fred wilson"
      topics: [investing, strategy, web3, startups]
      action: prepare_for_research
    - pattern: "stratechery"
      topics: [tech, strategy, business-models]
      action: prepare_for_research
      reason: "Ben Thompson's analysis"
    - pattern: "hbr"
      topics: [management, strategy, leadership]
      action: prepare_for_research
      url_pattern: "hbr.org/"
      reason: "Harvard Business Review"
    - pattern: "harvard business"
      topics: [management, strategy, leadership]
      action: prepare_for_research
    # Tech/AI research (technical deep dives)
    - pattern: "ben's bites"
      topics: [AI, tech, products, tools]
      action: prepare_for_research
      url_pattern: "bensbites.com/p/"
