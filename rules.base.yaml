    # Newsletters that should be routed to research (not archived)
    - pattern: "cerebral valley"
      action: prepare_for_research
      type: newsletter
      topics: [ai, ecosystem, events, jobs]
      reason: "AI ecosystem digest — hackathons, jobs, events"
    - pattern: "support5@vendor.example.com"
      action: prepare_for_research
      type: newsletter
      topics: [ai, ecosystem]
    # Hackathon/event newsletters (per ENG-2026-0521-024) — routed through
    # prepare_for_research (implemented, safe) rather than a dedicated
    # scan_for_events action, which does NOT exist in newsletter.py yet.
    # Full vision (parse body for hackathon/CFP dates, create DEADLINE tasks
    # automatically) needs new processor code — see next_actions.org task
    # "Mail rules: add scan_for_events action" for the scoped follow-up.
    - pattern: "dev.to"
      action: prepare_for_research
